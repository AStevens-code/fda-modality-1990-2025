name: Reproduce figures

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install pinned environment
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nbconvert ipykernel

      - name: Execute the figure notebook
        working-directory: notebooks
        run: |
          jupyter nbconvert --to notebook --execute --inplace \
            --ExecutePreprocessor.timeout=900 01_reproduce_figures.ipynb

      - name: Check the reproduction
        run: python scripts/check_reproduction.py

      - name: Upload regenerated figures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regenerated-figures
          path: figures/*.png
